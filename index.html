<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='8' width='18' height='20' rx='4' fill='%23E6E6EC'/%3E%3Crect x='10' y='4' width='18' height='24' rx='4' fill='%23FF5A4E'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#F5F6F8; --surface:#FFFFFF; --surface-2:#FBFBFC; --border:#E6E6EC;
    --ink:#14141B; --ink-soft:#6B6B76; --ink-faint:#6F6F79;
    --accent:#FF5A4E; --accent-ink:#FFFFFF; --accent-soft:#FFE9E6;
    --accent-fill:#C8433A;
    --danger:#DC2626; --danger-ink:#FFFFFF;
    --radius-lg:20px; --radius-md:12px; --radius-sm:8px; --radius-pill:999px;
    --shadow-sm:0 1px 3px rgba(20,20,27,.07);
    --shadow-md:0 8px 24px rgba(20,20,27,.09);
    --shadow-lg:0 24px 60px rgba(20,20,27,.22);
    --font-display:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --dur:.18s;
  }
  [data-theme="dark"]{
    --paper:#0F0E12; --surface:#1A191F; --surface-2:#201F26; --border:#2B2A32;
    --ink:#F2F2F5; --ink-soft:#9C9CA6; --ink-faint:#7B7B85;
    --accent:#FF6B5E; --accent-ink:#14141B; --accent-soft:#3A211D;
    --accent-fill:#FF6B5E;
    --danger:#F87171; --danger-ink:#14141B;
    --shadow-sm:0 1px 3px rgba(0,0,0,.4);
    --shadow-md:0 8px 24px rgba(0,0,0,.45);
    --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; min-height:100vh; padding-bottom:48px;
    transition:background var(--dur) ease,color var(--dur) ease;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:.95rem;}
  a{color:inherit;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

  /* ---------- banner ---------- */
  .banner{
    display:flex; align-items:center; gap:10px; justify-content:center;
    background:var(--accent-soft); color:var(--ink); font-size:.82rem;
    padding:10px 16px; border-bottom:1px solid var(--border);
  }
  .banner svg{flex:none; color:var(--accent);}
  .banner button{background:none; border:none; color:var(--ink-soft); padding:2px; flex:none; border-radius:6px;}
  .banner button:hover{color:var(--ink);}

  /* ---------- header ---------- */
  .header{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--border);}
  .header-inner{
    max-width:1180px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; gap:14px;
  }
  .logo{display:flex; align-items:center; gap:8px; flex:none; min-width:0; max-width:26vw;}
  .logo-word{font-size:1.25rem; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  @media(max-width:480px){.logo-word{font-size:1rem;}}
  @media(max-width:400px){.logo-word{display:none;} .logo{max-width:none;}}
  .search-wrap{position:relative; flex:1; min-width:0;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none;}
  .search-wrap input{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-pill);
    padding:9px 14px 9px 38px; color:var(--ink); -webkit-text-fill-color:var(--ink); caret-color:var(--accent);
    -webkit-appearance:none; appearance:none; opacity:1;
    transition:border-color var(--dur) ease, box-shadow var(--dur) ease;
  }
  .search-wrap input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none;}
  .search-wrap input::placeholder{color:var(--ink-faint);}
  .header-actions{display:flex; align-items:center; gap:6px; flex:none; position:relative;}

  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px;
    background:transparent; border:1px solid transparent; border-radius:var(--radius-pill); color:var(--ink-soft);
    transition:background var(--dur) ease, color var(--dur) ease, border-color var(--dur) ease;
  }
  .icon-btn:hover{background:var(--surface-2); color:var(--ink); border-color:var(--border);}
  .icon-btn.sm{width:30px; height:30px;}

  .btn-primary{
    display:inline-flex; align-items:center; gap:6px; background:var(--accent-fill); color:var(--accent-ink);
    border:none; border-radius:var(--radius-pill); padding:9px 18px; font-weight:600; font-size:.9rem;
    box-shadow:var(--shadow-sm); transition:transform var(--dur) ease, box-shadow var(--dur) ease, filter var(--dur) ease;
    white-space:nowrap;
  }
  .btn-primary:hover{filter:brightness(1.05); box-shadow:var(--shadow-md); transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0); filter:brightness(.97);}
  .btn-primary.sm{padding:7px 14px; font-size:.82rem;}
  .btn-ghost{
    background:transparent; border:1px solid var(--border); color:var(--ink); border-radius:var(--radius-pill);
    padding:9px 18px; font-size:.9rem; font-weight:500; transition:background var(--dur) ease;
  }
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{
    background:var(--danger); color:var(--danger-ink); border:none; border-radius:var(--radius-pill);
    padding:9px 18px; font-size:.9rem; font-weight:600; transition:filter var(--dur) ease;
  }
  .btn-danger:hover{filter:brightness(1.05);}
  .link-btn{background:none; border:none; color:var(--accent); font-weight:600; padding:0; text-decoration:underline;}

  .overflow-menu{
    position:absolute; top:46px; right:0; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); box-shadow:var(--shadow-lg); padding:6px; width:230px; z-index:30;
  }
  .overflow-menu button{
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink);
    padding:9px 10px; border-radius:var(--radius-sm); font-size:.88rem;
  }
  .overflow-menu button:hover{background:var(--surface-2);}
  .overflow-menu .menu-divider{height:1px; background:var(--border); margin:6px 4px;}
  .privacy-note{font-size:.76rem; color:var(--ink-soft); padding:8px 10px 4px; line-height:1.4;}
  .usage-stat{font-size:.76rem; color:var(--ink-faint); padding:6px 10px 0; line-height:1.4;}

  /* ---------- view mode ---------- */
  .view-mode-row{
    max-width:1180px; margin:0 auto; padding:10px 20px 0; display:flex; gap:4px;
  }
  .view-mode-row[hidden]{display:none;}
  .mode-btn{
    flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-soft);
    padding:6px 10px; font-size:.78rem; font-weight:600; transition:background var(--dur) ease, color var(--dur) ease;
  }
  .mode-btn:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm);}
  .mode-btn:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
  .mode-btn:not(:first-child){border-left:none;}
  .mode-btn.active{background:var(--accent-fill); border-color:var(--accent-fill); color:var(--accent-ink);}

  /* ---------- toolbar (sort + select) ---------- */
  .toolbar-row{
    max-width:1180px; margin:0 auto; padding:8px 20px 0; display:flex; justify-content:flex-end; gap:8px;
  }
  .toolbar-btn{
    display:inline-flex; align-items:center; gap:5px; background:transparent; border:1px solid var(--border);
    color:var(--ink-soft); border-radius:var(--radius-pill); padding:5px 12px; font-size:.78rem; font-weight:600;
    transition:background var(--dur) ease, color var(--dur) ease, border-color var(--dur) ease;
  }
  .toolbar-btn:hover{background:var(--surface-2); color:var(--ink);}
  .toolbar-btn.active{background:var(--accent-soft); border-color:var(--accent); color:var(--ink);}
  .sort-control{position:relative;}
  .sort-menu{
    position:absolute; top:34px; right:0; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); box-shadow:var(--shadow-lg); padding:6px; width:150px; z-index:30;
  }
  .sort-menu button{
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink);
    padding:8px 10px; border-radius:var(--radius-sm); font-size:.85rem;
  }
  .sort-menu button:hover{background:var(--surface-2);}
  .sort-menu button.active{color:var(--accent); font-weight:600;}
  .sort-menu-divider{height:1px; background:var(--border); margin:6px 4px;}
  .sort-menu-toggle{
    display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:.85rem; color:var(--ink);
    cursor:pointer;
  }
  .sort-menu-toggle input{accent-color:var(--accent); width:15px; height:15px; flex:none;}

  /* ---------- bulk selection ---------- */
  .bulk-bar{
    position:fixed; left:12px; right:12px; bottom:16px; z-index:45; background:var(--ink); color:var(--paper);
    border-radius:var(--radius-lg); padding:12px 14px; display:flex; align-items:center; justify-content:space-between;
    gap:10px; box-shadow:var(--shadow-lg); max-width:600px; margin:0 auto;
  }
  [data-theme="dark"] .bulk-bar{background:var(--surface-2); border:1px solid var(--border); color:var(--ink);}
  .bulk-bar[hidden]{display:none;}
  .bulk-bar-actions{display:flex; align-items:center; gap:8px; flex:none;}
  .bulk-bar .btn-ghost.sm, .bulk-bar .btn-danger.sm{padding:6px 12px; font-size:.8rem;}
  .bulk-bar .btn-ghost.sm{border-color:rgba(255,255,255,.3); color:inherit;}
  .bulk-bar .link-btn{color:inherit; opacity:.75; text-decoration:underline; font-size:.8rem;}
  .card-select-check{
    position:absolute; top:10px; right:10px; width:24px; height:24px; border-radius:50%;
    background:rgba(20,20,27,.55); color:#fff; display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,.7); z-index:2;
  }
  .card-select-check.checked{background:var(--accent-fill); border-color:var(--accent-fill); color:var(--accent-ink);}
  .card.selectable{cursor:pointer;}
  .card.selected{outline:2px solid var(--accent); outline-offset:-2px;}
  .favorite-btn{
    position:absolute; bottom:10px; right:10px; width:30px; height:30px; border-radius:50%;
    background:rgba(20,20,27,.5); color:#fff; display:flex; align-items:center; justify-content:center;
    border:none; z-index:2; transition:transform var(--dur) ease, background var(--dur) ease;
  }
  .favorite-btn:hover{transform:scale(1.08);}
  .favorite-btn.active{background:var(--accent-fill); color:var(--accent-ink);}

  /* ---------- topic strip ---------- */
  .topic-strip{
    max-width:1180px; margin:0 auto; padding:14px 20px 4px; display:flex; gap:8px;
    overflow-x:auto; scrollbar-width:none;
  }
  .topic-strip::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; display:inline-flex; align-items:center; gap:6px; background:var(--surface);
    border:1px solid var(--border); color:var(--ink-soft); border-radius:var(--radius-pill);
    padding:7px 14px 7px 12px; font-size:.85rem; font-weight:500; white-space:nowrap;
    transition:background var(--dur) ease, color var(--dur) ease, border-color var(--dur) ease, transform var(--dur) ease;
  }
  .chip:hover{transform:translateY(-1px); border-color:var(--ink-faint);}
  .chip-dot{width:8px; height:8px; border-radius:50%; background:var(--chip-color,var(--accent)); flex:none;}
  .chip-count{
    background:var(--surface-2); color:var(--ink-faint); border-radius:var(--radius-pill);
    padding:1px 7px; font-size:.72rem; font-weight:600;
  }
  .chip-active{background:var(--chip-tint,var(--accent-soft)); border-color:var(--chip-color,var(--accent)); color:var(--ink);}
  .chip-active .chip-count{background:var(--surface); color:var(--ink);}
  .chip-add{color:var(--ink-soft); border-style:dashed;}
  .starter-chip{border-style:dashed;}
  .starter-chip.selected{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); border-style:solid;}
  .starter-chip:disabled{cursor:default;}

  /* ---------- main / grid ---------- */
  .main{max-width:1180px; margin:0 auto; padding:16px 20px 40px;}
  .grid{columns:1; column-gap:16px;}
  @media(min-width:560px){.grid{columns:2;}}
  @media(min-width:860px){.grid{columns:3;}}
  @media(min-width:1180px){.grid{columns:4;}}

  .card{
    break-inside:avoid; margin-bottom:16px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm);
    border-top:3px solid var(--card-accent,var(--border));
    transition:transform var(--dur) ease, box-shadow var(--dur) ease;
  }
  .card:hover{transform:translateY(-3px); box-shadow:var(--shadow-md);}
  .card-thumb{position:relative; width:100%; aspect-ratio:4/5; background:var(--surface-2); overflow:hidden;}
  .card-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb-fallback{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--ink);}
  .platform-badge{
    position:absolute; top:10px; left:10px; min-width:26px; height:26px; padding:0 7px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:700; color:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.25); letter-spacing:.02em;
  }
  .card-body{padding:12px 14px 14px;}
  .card-title{font-size:.98rem; line-height:1.35; margin-bottom:6px; font-weight:600;}
  .card-topics{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px;}
  .tag{
    font-size:.7rem; font-weight:600; color:var(--tag-color); background:color-mix(in srgb, var(--tag-color) 14%, transparent);
    padding:3px 9px; border-radius:var(--radius-pill);
  }
  .card-notes{font-size:.8rem; color:var(--ink-soft); line-height:1.4; margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-footer{display:flex; align-items:center; justify-content:space-between; margin-top:4px;}
  .card-date{font-size:.7rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}
  .card-actions{display:flex; gap:2px;}

  /* ---------- empty states ---------- */
  .empty-state{display:flex; align-items:center; justify-content:center; padding:40px 16px;}
  .onboarding{max-width:420px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;}
  .onboarding svg{margin-bottom:6px; animation:float 5s ease-in-out infinite;}
  .onboarding h2{font-size:1.3rem;}
  .onboarding p{color:var(--ink-soft); font-size:.9rem; line-height:1.5;}
  .onboarding .hint{color:var(--ink-faint); font-size:.78rem; margin-top:8px; text-transform:uppercase; letter-spacing:.04em;}
  .starter-chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:8px 0 14px;}
  .empty-inline{text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px;}
  .empty-inline h3{font-size:1.05rem;}
  .empty-inline p{color:var(--ink-soft); font-size:.85rem;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

  /* ---------- modals ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,10,14,.45); display:flex; align-items:flex-end;
    justify-content:center; z-index:50; opacity:0; transition:opacity var(--dur) ease;
  }
  .modal-backdrop[hidden]{display:none;}
  .modal-backdrop.open{opacity:1;}
  .modal{
    background:var(--surface); width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    border-radius:var(--radius-lg) var(--radius-lg) 0 0; padding:22px 22px calc(22px + env(safe-area-inset-bottom));
    box-shadow:var(--shadow-lg); transform:translateY(16px); transition:transform var(--dur) ease;
  }
  .modal-backdrop.open .modal{transform:translateY(0);}
  .modal h2{font-size:1.2rem; margin-bottom:16px;}
  .modal-sm{max-width:380px;}
  @media(min-width:640px){
    .modal-backdrop{align-items:center;}
    .modal{border-radius:var(--radius-lg); transform:translateY(8px) scale(.98);}
  }
  #itemForm label,.field-group{display:block; font-size:.8rem; font-weight:600; color:var(--ink-soft); margin-bottom:14px;}
  .optional{font-weight:400; color:var(--ink-faint); text-transform:none;}
  #itemForm input,#itemForm select,#itemForm textarea{
    display:block; width:100%; margin-top:6px; padding:10px 12px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:var(--radius-md); color:var(--ink); font-weight:400;
  }
  #itemForm input:focus,#itemForm select:focus,#itemForm textarea:focus{border-color:var(--accent); outline:none;}
  #itemForm textarea{resize:vertical;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:6px;}
  .more-details-toggle{background:none; border:none; color:var(--accent); font-weight:600; font-size:.85rem; padding:4px 0 14px; text-align:left;}
  .more-details{overflow:hidden; max-height:0; opacity:0; transition:max-height .25s ease, opacity .2s ease;}
  .more-details.open{max-height:400px; opacity:1;}
  .btn-primary:active,.btn-ghost:active,.btn-danger:active,.icon-btn:active,.chip:active{transform:scale(.96);}

  .topic-pick-list{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px;}
  .topic-pick-chip{
    background:var(--surface-2); border:1px solid var(--border); color:var(--ink-soft); border-radius:var(--radius-pill);
    padding:6px 13px; font-size:.82rem; font-weight:500; transition:all var(--dur) ease;
  }
  .topic-pick-chip.selected{background:var(--chip-color); border-color:var(--chip-color); color:#fff;}
  .topic-pick-chip.add-new{border-style:dashed;}
  .inline-new-topic{display:flex; gap:8px; margin-top:10px;}
  .inline-new-topic input{flex:1; padding:8px 12px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--ink);}

  .topic-manage-list{display:flex; flex-direction:column; gap:6px; margin-bottom:16px; max-height:280px; overflow-y:auto;}
  .topic-manage-row{display:flex; align-items:center; gap:10px; padding:6px; border-radius:var(--radius-sm);}
  .topic-manage-row .chip-dot{width:10px; height:10px;}
  .topic-rename-input{flex:1; border:1px solid transparent; background:transparent; color:var(--ink); padding:6px 8px; border-radius:var(--radius-sm); font-size:.88rem;}
  .topic-rename-input:hover,.topic-rename-input:focus{background:var(--surface-2); border-color:var(--border); outline:none;}
  .topic-manage-count{font-size:.72rem; color:var(--ink-faint); flex:none;}
  .new-topic-form{display:flex; gap:8px; padding-top:10px; border-top:1px solid var(--border);}
  .new-topic-form input{flex:1; padding:9px 12px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--ink);}
  .hint{color:var(--ink-soft); font-size:.85rem; font-weight:400;}

  /* ---------- toast ---------- */
  .toast-container{position:fixed; left:0; right:0; bottom:20px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:60; pointer-events:none;}
  .toast{
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:var(--radius-pill);
    font-size:.85rem; box-shadow:var(--shadow-lg); opacity:0; transform:translateY(8px); transition:opacity var(--dur) ease, transform var(--dur) ease;
  }
  [data-theme="dark"] .toast{background:var(--surface-2); color:var(--ink); border:1px solid var(--border);}
  .toast.show{opacity:1; transform:translateY(0);}

  /* ---------- html import ---------- */
  .onboarding-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:4px;}
  .import-summary{font-size:.85rem; color:var(--ink-soft); line-height:1.5; margin-bottom:4px;}
  .import-summary strong{color:var(--ink);}
  .import-topics-preview{display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 4px;}

  function normalizeUrlForDedup(url){

  function migrateTopicsAndItems(topics, items){
    topics.forEach(function(t){

  }
  function itemCountForTopic(topicId){
    var n=0; for(var i=0;i<state.items.length;i++){ if(state.items[i].topicIds.indexOf(topicId)!==-1) n++; }
    return n;
  }
  function createTopic(name, isCreator){
    var topic = {id:uid('topic'), name:name, colorIndex:state.topics.length, isCreator:!!isCreator, updatedAt:Date.now()};
    state.topics.push(topic);
    persist();
    queueSync('topics', topic);
    return topic;
  }

  // Queues a change (or a deletion tombstone) for the sync client, if signed in.
  // Safe to call even when Sync isn't loaded or the user is offline/anonymous.
  function queueSync(kind, record){
    if(window.Sync && window.Sync.user) window.Sync.queueChange(kind, record);
  }
  function tombstoneFor(record){
    var t = Date.now();
    var copy = {}; for(var k in record){ copy[k]=record[k]; }
    copy.deletedAt = t; copy.updatedAt = t;
    return copy;
  }

  /* ---------------- filtering ---------------- */
  function getFilteredItems(){
    var items = state.items.slice();
    if(activeTopicId !== 'all'){
      items = items.filter(function(it){ return it.topicIds.indexOf(activeTopicId) !== -1; });
    }
    var q = searchQuery.trim().toLowerCase();
    if(q){
      items = items.filter(function(it){
        var topicNames = it.topicIds.map(function(id){ var t=getTopicById(id); return t?t.name:''; }).join(' ').toLowerCase();
        var platLabel = (PLATFORMS[it.platform]||PLATFORMS.other).label.toLowerCase();
        return it.title.toLowerCase().indexOf(q)!==-1 ||
               (it.notes||'').toLowerCase().indexOf(q)!==-1 ||
               topicNames.indexOf(q)!==-1 ||
               platLabel.indexOf(q)!==-1;
      });
    }
    items.sort(function(a,b){
      // "Favorites first" is an independent toggle, not baked into a sort
      // mode, so it composes cleanly with whichever sort is active below.
      if(state.favoritesFirst && !!b.favorite !== !!a.favorite) return (b.favorite?1:0) - (a.favorite?1:0);
      switch(state.sortBy){
        case 'oldest': return a.createdAt - b.createdAt;
        case 'alpha': return a.title.localeCompare(b.title);
        case 'alpha_desc': return b.title.localeCompare(a.title);
        case 'updated': return (b.updatedAt||b.createdAt) - (a.updatedAt||a.createdAt);
        case 'platform':
          var pa = (PLATFORMS[a.platform]||PLATFORMS.other).label;
          var pb = (PLATFORMS[b.platform]||PLATFORMS.other).label;
          return pa.localeCompare(pb) || (b.createdAt - a.createdAt);
        default: return b.createdAt - a.createdAt; // newest
      }
    });
    return items;
  }

    return '<button type="button" class="chip'+(active?' chip-active':'')+'" data-topic-id="'+id+'" '+style+'>'+
      (color ? '<span class="chip-dot"></span>' : '') + escapeHtml(name) +

  }

  /* ---------------- confirm modal ---------------- */
  // `options.label` and `options.danger` let call sites override the button

  function showConfirm(message, onConfirm, options){

      ? 'Delete everything in your stash on every synced device? This cannot be undone.'

  /* ---------------- import from html ---------------- */
  var MAX_IMPORT_CANDIDATES = 1000;
  var htmlImportCandidates = [];

  function findOrCreateTopicByName(name, isCreator){
    var lower = name.toLowerCase();
    for(var i=0;i<state.topics.length;i++){
      if(state.topics[i].name.toLowerCase()===lower) return state.topics[i];
    }
    return createTopic(name, isCreator);
  }

  function detectPlatformFromUrl(url){
    try{
      var host = new URL(url, window.location.href).hostname.replace(/^www\./,'').toLowerCase();
      if(host.indexOf('instagram.com')!==-1 || host.indexOf('instagr.am')!==-1) return 'instagram';
      if(host.indexOf('tiktok.com')!==-1) return 'tiktok';
      if(host.indexOf('pinterest.')!==-1 || host==='pin.it') return 'pinterest';
      if(host.indexOf('youtube.com')!==-1 || host==='youtu.be') return 'youtube';
      if(host.indexOf('facebook.com')!==-1 || host==='fb.watch') return 'facebook';
      if(host.indexOf('twitter.com')!==-1 || host.indexOf('x.com')!==-1) return 'twitter';
      return 'other';
    }catch(e){ return 'other'; }
  }

  function extractUsernameHint(url, platform){
    try{
      var parts = new URL(url, window.location.href).pathname.split('/').filter(Boolean);
      if(platform==='tiktok'){
        var at = parts.filter(function(p){ return p.indexOf('@')===0; })[0];
        if(at) return at;
      }
      if(platform==='twitter' && parts.length>=2 && parts[1]==='status') return '@'+parts[0];
      if(platform==='instagram' && parts.length>=3 && ['p','reel','tv'].indexOf(parts[1])!==-1) return '@'+parts[0];
      if(platform==='facebook' && parts.length>=2 && ['videos','posts','photos','reel'].indexOf(parts[1])!==-1 && !/^\d+$/.test(parts[0])) return '@'+parts[0];
    }catch(e){}
    return '';
  }

  function extractContentTypeHint(url, platform){
    var path = '';
    try{ path = new URL(url, window.location.href).pathname.toLowerCase(); }catch(e){}
    if(platform==='instagram'){
      if(path.indexOf('/reel/')!==-1) return 'Reel';
      if(path.indexOf('/tv/')!==-1) return 'IGTV video';
      return 'Post';
    }
    if(platform==='tiktok') return 'video';
    if(platform==='youtube') return path.indexOf('/shorts/')!==-1 ? 'Short' : 'video';
    if(platform==='pinterest') return 'Pin';
    if(platform==='facebook') return path.indexOf('/reel/')!==-1 ? 'Reel' : (path.indexOf('/watch')!==-1 ? 'video' : 'post');
    if(platform==='twitter') return 'post';
    return '';
  }

  var DATE_RE = /\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+\d{1,2},?\s+\d{4}\b|\b\d{4}-\d{2}-\d{2}\b/i;

  // Lightweight keyword classifier for auto-tagging imports with a broad topic
  // (Food, Tech, etc.) alongside the creator tag. Checked against title+notes text.
  // Matches whole words only (via \b boundaries) — plain substring matching
  // previously misfired, e.g. "run" (Fitness) matching inside "brunch" or
  // "prune" (Food), so a food video would get tagged Fitness instead.
  var CATEGORY_KEYWORDS = {
    'Food': ['recipe','recipes','cooking','baking','baked','kitchen','dinner','lunch','breakfast','meal','pasta','dessert','snack','food','chef','ingredient','sauce','soup','grill','cocktail','vegan','vegetarian'],
    'Tech': ['tech','software','coding','programming','startup','gadget','iphone','android','laptop','computer','chatgpt'],
    'Fitness': ['workout','fitness','gym','exercise','training','muscle','cardio','yoga','running','stretching','reps','pushups','squats'],
    'Fashion': ['outfit','fashion','style','ootd','wardrobe','sneaker','accessory'],
    'Travel': ['travel','vacation','flight','hotel','destination','itinerary','airport','backpack','tourist'],
    'Home & DIY': ['diy','home decor','decor','renovation','cleaning','organize','organization','furniture','garden','interior'],
    'Beauty': ['makeup','skincare','beauty','haircare','cosmetic'],
    'Money': ['finance','budget','saving','investing','crypto','side hustle'],
    'Quotes': ['quote','quotes','motivation','motivational','inspiration','inspirational','affirmation'],
    'Books': ['book','books','novel','reading','author','bookclub','bookish','library'],
    'Music': ['music','song','songs','album','playlist','concert','lyrics','artist','band'],
    'Sports': ['football','basketball','soccer','baseball','tennis','golf','sports','athlete','match','tournament'],
    'Pets': ['dog','dogs','cat','cats','puppy','kitten','pet','pets','vet']
  };
  var CATEGORY_REGEX_CACHE = null;
  function buildCategoryRegexCache(){
    var cache = {};
    for(var category in CATEGORY_KEYWORDS){
      var words = CATEGORY_KEYWORDS[category];
      cache[category] = words.map(function(w){
        var escaped = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return new RegExp('\\b' + escaped + '\\b', 'i');
      });
    }
    return cache;
  }
  function categorizeText(text){
    if(!text) return '';
    if(!CATEGORY_REGEX_CACHE) CATEGORY_REGEX_CACHE = buildCategoryRegexCache();
    for(var category in CATEGORY_REGEX_CACHE){
      var regexes = CATEGORY_REGEX_CACHE[category];
      for(var i=0;i<regexes.length;i++){
        if(regexes[i].test(text)) return category;
      }
    }
    return '';
  }
  function extractDateHint(text){ var m = text && text.match(DATE_RE); return m ? m[0] : ''; }

  function buildFallbackTitle(href, platform, dateHint){
    var plat = PLATFORMS[platform] || PLATFORMS.other;
    var typeHint = extractContentTypeHint(href, platform);
    var userHint = extractUsernameHint(href, platform);
    var title = platform==='other' ? 'Saved link' : (plat.label + (typeHint ? ' '+typeHint : ''));
    if(userHint) title += ' by ' + userHint;
    if(dateHint) title += ' — saved ' + dateHint;
    return title;
  }

  function firstSentenceOrSlice(text, maxLen){
    if(!text) return '';
    var m = text.slice(0, maxLen+40).match(/^(.{15,}?[.!?])(\s|$)/);
    if(m && m[1].length <= maxLen+20) return m[1].trim();
    return text.length > maxLen ? text.slice(0,maxLen).trim() : text;
  }

  var BAD_IMG_PATTERN = /pixel|spacer|blank\.(gif|png)|transparent|1x1|loading|placeholder-?icon/i;
  var GENERIC_ALT_PATTERN = /^(image|photo|photograph|thumbnail|thumb|preview|video|video preview|icon|picture|img|media)\.?$/i;

  function imgSrcCandidate(img){
    if(!img) return '';
    var src = img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('data-lazy-src') ||
      img.getAttribute('data-original') || img.getAttribute('data-thumb') || '';
    if(!src){
      var srcset = img.getAttribute('srcset') || img.getAttribute('data-srcset');
      if(srcset) src = srcset.split(',')[0].trim().split(/\s+/)[0] || '';
    }
    if(src && BAD_IMG_PATTERN.test(src)) return '';
    return src;
  }

  function findThumbnail(a, container){
    var direct = imgSrcCandidate(a.querySelector('img'));
    if(direct) return direct;
    if(container){
      var inContainer = imgSrcCandidate(container.querySelector('img'));
      if(inContainer) return inContainer;
    }
    var sib = a.parentElement;
    for(var i=0; sib && i<2; i++, sib=sib.parentElement){
      var prev = sib.previousElementSibling, next = sib.nextElementSibling;
      var fromPrev = prev ? imgSrcCandidate(prev.tagName==='IMG'?prev:prev.querySelector('img')) : '';
      if(fromPrev) return fromPrev;
      var fromNext = next ? imgSrcCandidate(next.tagName==='IMG'?next:next.querySelector('img')) : '';
      if(fromNext) return fromNext;
    }
    // Wider fallback: climb further and search the whole subtree at each level.
    var node = a.parentElement, hop = 0;
    while(node && hop<4 && node.tagName!=='BODY' && node.tagName!=='HTML'){
      var found = imgSrcCandidate(node.querySelector('img'));
      if(found) return found;
      node = node.parentElement;
      hop++;
    }
    return '';
  }

  function directTextOf(el){
    var t = '';
    for(var i=0;i<el.childNodes.length;i++){
      if(el.childNodes[i].nodeType===3) t += el.childNodes[i].textContent;
    }
    return t.trim();
  }

  var OWNER_LABEL_RE = /^owner:?$/i;
  var OWNER_INLINE_RE = /^owner\s*[:\-\u2013]?\s+(\S+)/i;

  function searchSubtreeForOwnerLabel(container){
    var all = container.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var el = all[i];
      var direct = directTextOf(el);

      // Pattern A: "Owner: username", "Owner - username", or "Owner username" as one element's own text.
      var inline = direct.match(OWNER_INLINE_RE);
      if(inline && inline[1] && inline[1].length<60) return inline[1];

      // Pattern B: "Owner" alone as a label, value in a nearby sibling.
      if(!OWNER_LABEL_RE.test(direct)) continue;
      var candidates = [];
      if(el.nextElementSibling) candidates.push(el.nextElementSibling);
      if(el.previousElementSibling) candidates.push(el.previousElementSibling);
      if(el.parentElement && el.parentElement.nextElementSibling) candidates.push(el.parentElement.nextElementSibling);
      if(el.parentElement){
        var sibs = el.parentElement.children;
        for(var s=0;s<sibs.length;s++){ if(sibs[s]!==el) candidates.push(sibs[s]); }
      }
      for(var c=0;c<candidates.length;c++){
        var val = (candidates[c].textContent||'').trim();
        if(val && val.length<60 && !OWNER_LABEL_RE.test(val)) return val;
      }
    }
    return '';
  }

  function findOwnerCreator(startEl){
    var node = startEl, hop = 0;
    while(node && hop<4 && node.tagName!=='BODY' && node.tagName!=='HTML'){
      var found = searchSubtreeForOwnerLabel(node);
      if(found) return '@'+found.replace(/^@/,'');
      node = node.parentElement;
      hop++;
    }
    return '';
  }

  function findLabeledTableValue(table, label){
    if(!table) return '';
    var labelLower = label.toLowerCase();
    var rows = table.querySelectorAll('tr');
    for(var i=0;i<rows.length;i++){
      var cells = rows[i].querySelectorAll('td,th');
      for(var c=0;c<cells.length-1;c++){
        if((cells[c].textContent||'').trim().toLowerCase()===labelLower){
          var val = (cells[c+1].textContent||'').trim();
          if(val) return val;
        }
      }
    }
    return '';
  }

  function candidateFromAnchor(a){
    var href = (a.getAttribute('href')||'').trim();
    if(!href || href==='#' || /^javascript:/i.test(href) || /^mailto:/i.test(href) || /^tel:/i.test(href)) return null;

    var anchorText = (a.textContent||'').trim().replace(/\s+/g,' ');

    // Meta/Instagram-style table exports label each field ("Caption", "Username", "Name")
    // as a <td> immediately followed by its value <td>, all within one <table> per saved
    // item. Check this first since it's far more reliable than guessing from raw text.
    var entryTable = a.closest('table');
    var tableUsername = entryTable ? (findLabeledTableValue(entryTable,'Username') || findLabeledTableValue(entryTable,'Name')) : '';
    var tableCaption = entryTable ? findLabeledTableValue(entryTable,'Caption') : '';

    // Climb ancestors (bounded) to find real caption text — export tools often wrap each
    // saved link in several sparse nested divs, so the immediate parent alone is often empty.
    var node = a.parentElement;
    var description = tableCaption;
    var descContainer = node;
    if(!description){
      var hops = 0;
      while(node && hops < 3 && node.tagName!=='BODY' && node.tagName!=='HTML'){
        var t = (node.textContent||'').trim().replace(/\s+/g,' ');
        var extra = (anchorText && t.indexOf(anchorText)===0) ? t.slice(anchorText.length).trim() : t;
        if(extra.replace(/[^A-Za-z0-9]/g,'').length > 10){ description = extra; descContainer = node; break; }
        descContainer = node;
        node = node.parentElement;
        hops++;
      }
    }
    if(description.length>300) description = description.slice(0,300)+'…';

    var nearbyImg = a.querySelector('img') || (descContainer ? descContainer.querySelector('img') : null);
    var rawImgAlt = nearbyImg ? (nearbyImg.getAttribute('alt')||'').trim() : '';
    var imgAlt = GENERIC_ALT_PATTERN.test(rawImgAlt) ? '' : rawImgAlt;
    var thumb = findThumbnail(a, descContainer);

    var platform = detectPlatformFromUrl(href);
    var ownerRaw = tableUsername ? ('@'+tableUsername.replace(/^@/,'')) : findOwnerCreator(a);
    var creator = ownerRaw || extractUsernameHint(href, platform);
    var descNoOwner = description.replace(/#[A-Za-z0-9_]+/g,'');
    if(ownerRaw && !tableCaption){
      descNoOwner = descNoOwner.replace(new RegExp('\\bOwner:?\\b','gi'), '').replace(ownerRaw.replace(/^@/,''), '');
    }
    var cleanNotes = descNoOwner.replace(/\s+/g,' ').trim();
    var dateHint = extractDateHint(description) || extractDateHint(imgAlt);
    var notesMinusDate = dateHint ? cleanNotes.replace(dateHint,'').trim() : cleanNotes;
    var hasMeaningfulNotes = notesMinusDate.replace(/[^A-Za-z0-9]/g,'').length > 8;

    var rawTitleSource = anchorText || a.getAttribute('title') || a.getAttribute('aria-label') || imgAlt || '';
    var looksLikeUrl = rawTitleSource && (rawTitleSource===href || /^https?:\/\//i.test(rawTitleSource));
    var title = (rawTitleSource && !looksLikeUrl) ? rawTitleSource : '';
    if(!title) title = hasMeaningfulNotes ? firstSentenceOrSlice(cleanNotes, 70) : buildFallbackTitle(href, platform, dateHint);
    if(title.length>140) title = title.slice(0,140).trim();
    var finalNotes = hasMeaningfulNotes ? cleanNotes : (dateHint ? ('Saved '+dateHint) : '');
    var category = categorizeText(title + ' ' + finalNotes);

    return {href:href, title:title, notes:finalNotes, thumb:thumb, platform:platform, creator:creator, category:category};
  }

  function findLinkInObject(obj, depth){
    if(!obj || typeof obj!=='object' || (depth||0)>3) return '';
    for(var k in obj){
      if(typeof obj[k]==='string' && /^https?:\/\//i.test(obj[k])) return obj[k];
    }
    for(var k2 in obj){
      var v = obj[k2];
      if(v && typeof v==='object' && !Array.isArray(v)){
        var found = findLinkInObject(v, (depth||0)+1);
        if(found) return found;
      }
      if(Array.isArray(v)){
        for(var i=0;i<v.length;i++){
          if(v[i] && typeof v[i]==='object'){ var f2 = findLinkInObject(v[i], (depth||0)+1); if(f2) return f2; }
        }
      }
    }
    return '';
  }

  function findImageInObject(obj, depth){
    if(!obj || typeof obj!=='object' || (depth||0)>2) return '';
    for(var k in obj){
      if(typeof obj[k]==='string' && /^https?:\/\//i.test(obj[k]) && /image|thumb|photo|picture|media/i.test(k)) return obj[k];
    }
    for(var k2 in obj){
      var v = obj[k2];
      if(v && typeof v==='object' && !Array.isArray(v)){
        var found = findImageInObject(v, (depth||0)+1);
        if(found) return found;
      }
    }
    return '';
  }

  function shallowTextFields(obj){
    var out = [];
    if(!obj || typeof obj!=='object') return out;
    for(var k in obj){
      var v = obj[k];
      if(typeof v==='string' && v && !/^https?:\/\//i.test(v)) out.push(v);
    }
    return out;
  }

  function timestampInObject(obj, depth){
    if(!obj || typeof obj!=='object' || (depth||0)>3) return 0;
    for(var k in obj){
      if(/time|date/i.test(k) && typeof obj[k]==='number'){
        var n = obj[k];
        if(n > 1e12) return n;
        if(n > 1e9) return n*1000;
      }
    }
    for(var k2 in obj){
      if(obj[k2] && typeof obj[k2]==='object'){
        var nested = timestampInObject(obj[k2], (depth||0)+1);
        if(nested) return nested;
      }
    }
    return 0;
  }

  function candidateFromJsonEntry(entry){
    if(!entry || typeof entry!=='object') return null;
    var href = findLinkInObject(entry, 0);
    if(!href) return null;
    var platform = detectPlatformFromUrl(href);
    var ts = timestampInObject(entry, 0);
    var dateHint = ts ? formatDate(ts) : '';
    var thumb = findImageInObject(entry, 0);

    var texts = shallowTextFields(entry);
    for(var k in entry){
      var v = entry[k];
      if(v && typeof v==='object'){
        if(Array.isArray(v)) v.forEach(function(item){ texts = texts.concat(shallowTextFields(item)); });
        else texts = texts.concat(shallowTextFields(v));
      }
    }

    var creator = '', titleText = '';
    texts.forEach(function(raw){
      var val = (raw||'').trim();
      if(!val || val.length>200) return;
      if(!creator && /^[\w.]+$/.test(val) && val.length<40){ creator = '@'+val.replace(/^@/,''); }
      else if(!titleText && /\s/.test(val) && val.length>3){ titleText = val; }
    });
    if(!creator) creator = extractUsernameHint(href, platform);

    var title = titleText || buildFallbackTitle(href, platform, dateHint);
    if(title.length>140) title = title.slice(0,140).trim();
    var notes = (!titleText && dateHint) ? ('Saved '+dateHint) : '';
    var category = categorizeText(title + ' ' + notes);

    return {href:href, title:title, notes:notes, thumb:thumb, platform:platform, creator:creator, category:category};
  }

  function findEntryArray(root){
    var best = null, bestScore = 0;
    function scoreArray(arr){
      var s = 0;
      for(var i=0;i<arr.length && i<80;i++){
        if(arr[i] && typeof arr[i]==='object' && findLinkInObject(arr[i],0)) s++;
      }
      return s;
    }
    function walk(node, depth){
      if(!node || typeof node!=='object' || depth>4) return;
      if(Array.isArray(node)){
        var s = scoreArray(node);
        if(s > bestScore){ bestScore = s; best = node; }
        node.forEach(function(item){ walk(item, depth+1); });
      } else {
        for(var k in node) walk(node[k], depth+1);
      }
    }
    walk(root, 0);
    return best;
  }

  function parseJsonForImport(parsed){
    var arr = findEntryArray(parsed);
    if(!arr) return [];
    var candidates = [];
    var seen = {};
    arr.forEach(function(entry){
      if(candidates.length >= MAX_IMPORT_CANDIDATES) return;
      var c = candidateFromJsonEntry(entry);
      if(!c) return;
      var key = normalizeUrlForDedup(c.href);
      if(seen[key]) return;
      seen[key] = true;
      candidates.push(c);
    });
    return candidates;
  }

  function parseHtmlForImport(text){
    var doc = new DOMParser().parseFromString(text, 'text/html');
    var anchors = $all('a[href]', doc);
    var candidates = [];
    var seenHrefs = {};
    for(var i=0; i<anchors.length && candidates.length<MAX_IMPORT_CANDIDATES; i++){
      var c = candidateFromAnchor(anchors[i]);
      if(!c) continue;
      var key = normalizeUrlForDedup(c.href);
      if(seenHrefs[key]) continue;
      seenHrefs[key] = true;
      candidates.push(c);
    }
    return candidates;
  }

  function existingUrlSet(){
    var set = {};
    state.items.forEach(function(it){ if(it.url) set[normalizeUrlForDedup(it.url)] = true; });
    return set;
  }

  function updateImportCount(){
    var checked = $all('#htmlImportList input[type="checkbox"]:checked').length;
    var btn = $('#confirmHtmlImportBtn');
    if(btn){ btn.textContent = checked ? ('Import '+checked+' item'+(checked===1?'':'s')) : 'Import'; btn.disabled = checked===0; }
  }

  function openHtmlImportPreview(candidates, headingText){
    htmlImportCandidates = candidates;
    $('#htmlImportHeading').textContent = headingText || 'Import items';
    renderImportRows();
    showModal($('#htmlImportModalBackdrop'));
  }

  function thumbHtml(c){
    if(!c.thumb) return '';
    return '<span class="import-row-thumb"><img src="'+escapeHtml(c.thumb)+'" alt="" loading="lazy" onerror="this.parentElement.remove();"></span>';
  }

  function renderImportRows(){
    var candidates = htmlImportCandidates;
    var includeCreator = $('#tagCreatorToggle').checked;
    var includeCategory = $('#tagCategoryToggle').checked;
    var existing = existingUrlSet();
    var newTopicNames = {};
    var dupCount = 0;

    var rowsHtml = candidates.map(function(c, idx){
      var isDup = !!existing[normalizeUrlForDedup(c.href)];
      if(isDup) dupCount++;
      if(includeCreator && c.creator){
        var key = c.creator.toLowerCase();
        var alreadyExists = state.topics.some(function(t){ return t.name.toLowerCase()===key; });
        if(!alreadyExists && !newTopicNames[key]) newTopicNames[key] = c.creator;
      }
      if(includeCategory && c.category){
        var catKey = c.category.toLowerCase();
        var catExists = state.topics.some(function(t){ return t.name.toLowerCase()===catKey; });
        if(!catExists && !newTopicNames[catKey]) newTopicNames[catKey] = c.category;
      }
      var plat = PLATFORMS[c.platform] || PLATFORMS.other;
      var tagParts = [];
      if(includeCreator && c.creator) tagParts.push('<span class="import-row-creator">'+escapeHtml(c.creator)+'</span>');
      if(includeCategory && c.category) tagParts.push('<span class="import-row-creator" style="color:var(--ink-soft)">'+escapeHtml(c.category)+'</span>');
      var tagsHtml = tagParts.length ? tagParts.join(' · ') : '<span style="opacity:.55">nothing detected</span>';
      return '<label class="import-row">'+
        '<input type="checkbox" data-import-idx="'+idx+'" '+(isDup?'':'checked')+'>'+
        thumbHtml(c) +
        '<span class="platform-badge" style="background:'+plat.bg+'">'+plat.mono+'</span>'+
        '<span class="import-row-text"><span class="import-row-title">'+escapeHtml(c.title)+'</span>'+
        '<span class="import-row-tags">'+tagsHtml+'</span></span>'+
        (isDup ? '<span class="dup-badge">Already saved</span>' : '')+
        '</label>';
    }).join('');

    $('#htmlImportList').innerHTML = rowsHtml;

    var newTopicList = Object.keys(newTopicNames).map(function(k){ return newTopicNames[k]; });
    $('#htmlImportSummary').innerHTML = '<strong>'+candidates.length+'</strong> item'+(candidates.length===1?'':'s')+' found'+
      (dupCount ? ', <strong>'+dupCount+'</strong> already in your stash' : '') + '.' +
      (newTopicList.length ? ' <strong>'+newTopicList.length+'</strong> new topic'+(newTopicList.length===1?'':'s')+' will be added.' : ' No creators or categories detected — items will import untagged.');

    $('#htmlImportTopicsPreview').innerHTML = newTopicList.slice(0,20).map(function(name){
      return '<span class="tag" style="--tag-color:var(--accent)">'+escapeHtml(name)+'</span>';
    }).join('');

    updateImportCount();
  }

  function commitHtmlImport(){
    var includeCreator = $('#tagCreatorToggle').checked;
    var includeCategory = $('#tagCategoryToggle').checked;
    var checkedBoxes = $all('#htmlImportList input[type="checkbox"]:checked');
    var count = 0;
    checkedBoxes.forEach(function(cb){
      var idx = parseInt(cb.getAttribute('data-import-idx'),10);
      var c = htmlImportCandidates[idx];
      if(!c) return;
      var topicIds = [];
      if(includeCreator && c.creator) topicIds.push(findOrCreateTopicByName(c.creator, true).id);
      if(includeCategory && c.category) topicIds.push(findOrCreateTopicByName(c.category, false).id);
      state.items.push({
        id:uid('item'), title:c.title, platform:c.platform, url:c.href, thumb:c.thumb,
        notes:c.notes, topicIds:topicIds, createdAt:Date.now()
      });
      count++;
    });
    persist();
    closeModal($('#htmlImportModalBackdrop'));
    renderAll();
    showToast('Imported '+count+' item'+(count===1?'':'s'));
  }

  $('#selectModeBtn').addEventListener('click', function(){
    selectMode = !selectMode;

    renderToolbar();
    renderGrid();
    renderBulkBar();
  });
  $('#selectAllBtn').addEventListener('click', function(){
    var visibleItems = getFilteredItems();
    var allSelected = visibleItems.length>0 && visibleItems.every(function(it){ return !!selectedIds[it.id]; });
    if(allSelected){
      selectedIds = {};
    } else {
      visibleItems.forEach(function(it){ selectedIds[it.id] = true; });
    }
    renderToolbar();
    renderGrid();
    renderBulkBar();

  $('#bulkCancelBtn').addEventListener('click', function(){
    selectMode = false;
    selectedIds = {};
    renderToolbar();
    renderGrid();
    renderBulkBar();
  });
  $('#bulkDeleteBtn').addEventListener('click', function(){
    var ids = Object.keys(selectedIds);
    if(ids.length===0) return;
    showConfirm('Delete '+ids.length+' item'+(ids.length===1?'':'s')+'? This can\'t be undone.', function(){
      ids.forEach(function(id){
        var item = state.items.filter(function(i){ return i.id===id; })[0];
        if(!item) return;
        queueSync('items', tombstoneFor(item));
        state.items = state.items.filter(function(i){ return i.id!==id; });
      });
      selectMode = false;
      selectedIds = {};
      persist();
      renderAll();
      showToast('Deleted '+ids.length+' item'+(ids.length===1?'':'s'));
    });
  });
  $('#bulkAddTopicBtn').addEventListener('click', function(){
    var ids = Object.keys(selectedIds);
    if(ids.length===0) return;
    openBulkTopicPicker(ids);
  });

  function openBulkTopicPicker(ids){
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;inset:0;background:rgba(10,10,14,.45);display:flex;align-items:center;justify-content:center;z-index:9999;';
    var chips = state.topics.map(function(t){
      return '<button type="button" class="topic-pick-chip" data-topic-id="'+t.id+'" style="--chip-color:'+topicColor(t).base+'">'+escapeHtml(t.name)+'</button>';
    }).join('');
    host.innerHTML = '<div style="background:var(--surface);color:var(--ink);width:min(340px,90vw);border-radius:16px;padding:20px;box-shadow:var(--shadow-lg);">'+
      '<h3 style="margin:0 0 12px;font-size:1.05rem;">Add topic to '+ids.length+' item'+(ids.length===1?'':'s')+'</h3>'+
      '<div class="topic-pick-list">'+chips+'</div>'+
      '<button type="button" id="bulkTopicCancel" style="width:100%;margin-top:14px;padding:9px;border:none;background:none;color:var(--ink-soft);font-size:.85rem;">Cancel</button>'+
    '</div>';
    document.body.appendChild(host);
    host.addEventListener('click', function(e){ if(e.target===host) host.remove(); });
    host.querySelector('#bulkTopicCancel').addEventListener('click', function(){ host.remove(); });
    $all('.topic-pick-chip', host).forEach(function(chip){
      chip.addEventListener('click', function(){
        var topicId = chip.getAttribute('data-topic-id');
        ids.forEach(function(id){
          var item = state.items.filter(function(i){ return i.id===id; })[0];
          if(!item) return;
          if(item.topicIds.indexOf(topicId)===-1) item.topicIds.push(topicId);
          item.updatedAt = Date.now();
          queueSync('items', item);
        });
        persist();
        host.remove();
        selectMode = false;
        selectedIds = {};
        renderAll();
        showToast('Topic added to '+ids.length+' item'+(ids.length===1?'':'s'));
      });
    });
  }

  $('#searchInput').addEventListener('input', function(e){
    searchQuery = e.target.value;
    renderGrid();
  });

  $('#itemForm').addEventListener('submit', function(e){
    e.preventDefault();
    var title = $('#fieldTitle').value.trim();
    var url = $('#fieldUrl').value.trim();
    if(!title && !url){ showToast('Add a link or a title to save this'); return; }
    var platform = $('#fieldPlatform').value;
    if(!title) title = buildFallbackTitle(url, platform, '');
    var data = {
      title:title,
      platform:platform,
      url:url,
      thumb:$('#fieldThumb').value.trim(),
      notes:$('#fieldNotes').value.trim(),
      topicIds:getSelectedTopicIds()
    };
    data.updatedAt = Date.now();

    function doSave(){
      if(editingItemId){
        var item = state.items.filter(function(i){return i.id===editingItemId;})[0];
        if(item){ for(var k in data){ item[k]=data[k]; } queueSync('items', item); }
        showToast('Saved');
      } else {
        data.id = uid('item');
        data.createdAt = Date.now();
        data.favorite = false;
        state.items.push(data);
        queueSync('items', data);
        showToast('Added to your stash');
      }
      persist();
      closeModal($('#itemModalBackdrop'));
      renderAll();
    }

    // Only warn about duplicates on new saves (not edits), and only when
    // there's an actual URL to compare — title-only saves can't collide.
    var isDuplicate = !editingItemId && url && existingUrlSet()[normalizeUrlForDedup(url)];
    if(isDuplicate){
      closeModal($('#itemModalBackdrop'));
      showConfirm('You already saved this link. Save it again anyway?', doSave, {label:'Save anyway', danger:false});
    } else {
      doSave();
    }
  });

  $('#newTopicForm').addEventListener('submit', function(e){
    e.preventDefault();
    var input = $('#newTopicName');
    var name = input.value.trim();
    if(!name) return;
    createTopic(name);
    input.value = '';
    renderTopicManageList();
    renderTopicStrip();
    showToast('Topic added');
  });

  $('#confirmOk').addEventListener('click', function(){
    var cb = confirmCallback;
    closeModal($('#confirmModalBackdrop'));
    if(cb) cb();
  });
  $('#confirmCancel').addEventListener('click', function(){ closeModal($('#confirmModalBackdrop')); });

  $all('[data-close]').forEach(function(btn){
    btn.addEventListener('click', function(){ closeModal(btn.closest('.modal-backdrop')); });
  });
  $all('.modal-backdrop').forEach(function(bd){
    bd.addEventListener('click', function(e){ if(e.target===bd) closeModal(bd); });
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){
      $all('.modal-backdrop:not([hidden])').forEach(function(bd){ closeModal(bd); });
      $('#overflowMenu').hidden = true;
      var sortMenu = $('#sortMenu');
      if(sortMenu) sortMenu.hidden = true;
    }
  });

  $('#menuToggle').addEventListener('click', function(e){
    e.stopPropagation();
    var menu = $('#overflowMenu');
    menu.hidden = !menu.hidden;
    if(!menu.hidden){
      var since = state.firstOpened ? formatDate(state.firstOpened) : formatDate(Date.now());
      $('#usageStat').textContent = 'Yours since '+since+' · opened '+state.opens+' time'+(state.opens===1?'':'s')+' on this device';
    }
  });
  document.addEventListener('click', function(e){
    var menu = $('#overflowMenu');
    if(!menu.hidden && !menu.contains(e.target) && e.target.id!=='menuToggle'){
      menu.hidden = true;
    }
  });
  $('#overflowMenu').addEventListener('click', function(e){
    var actionBtn = e.target.closest('[data-action]');
    if(!actionBtn) return;
    var act = actionBtn.getAttribute('data-action');
    $('#overflowMenu').hidden = true;
    if(act==='manage-topics') openTopicManageModal();
    else if(act==='export') exportData();
    else if(act==='import') $('#importFileInput').click();
    else if(act==='import-html') $('#htmlImportFileInput').click();
    else if(act==='clear-all') clearAllData();
    else if(act==='sync-open') { if(window.Sync) window.Sync.openPanel(); }
  });

  /* ---------------- sync integration ---------------- */
  // sync.js (loaded separately) reads/writes state through these three hooks
  // rather than touching the closure variables directly.
  window.getStashState = function(){ return state; };
  window.persistStashState = function(next){ state = next; persist(); };
  window.renderStashAll = function(){ renderAll(); };

  function refreshSyncUI(){
    var signedIn = !!(window.Sync && window.Sync.user);
    var btn = $('#syncMenuBtn');
    if(btn) btn.textContent = signedIn ? 'Manage sync' : 'Sync across devices';
    $('#privacyNote').textContent = signedIn
      ? '🔄 Syncing with your other devices.'
      : '🔒 Everything stays on this device unless you turn on sync.';
  }
  window.addEventListener('stash-sync-changed', refreshSyncUI);
  window.addEventListener('stash-sync-remote-update', function(){ renderAll(); });

  $('#importFileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(err){ showToast("That file doesn't look like valid JSON"); return; }

      if(parsed && Array.isArray(parsed.topics) && Array.isArray(parsed.items)){
        showConfirm('This looks like a full backup. Import will replace everything currently in your stash. Continue?', function(){
          // Run through the same migration as a normal page load, so a
          // backup from before favorites/topic-colors existed doesn't end
          // up with items/topics missing those fields.
          var migrated = migrateTopicsAndItems(parsed.topics, parsed.items);
          state = {
            topics:migrated.topics, items:migrated.items,
            theme:state.theme, opens:state.opens, firstOpened:state.firstOpened,
            // Keep this device's current view/sort preferences rather than
            // silently resetting them — the backup is about content, not
            // this device's display settings.
            viewMode:state.viewMode, sortBy:state.sortBy, favoritesFirst:state.favoritesFirst
          };
          activeTopicId = 'all';
          persist();
          renderAll();
          showToast('Backup imported');
        }, {label:'Replace'});
        return;
      }

      var candidates = [];
      try{ candidates = parseJsonForImport(parsed); }
      catch(err){ showToast('Could not read that JSON file'); return; }
      if(candidates.length===0){ showToast('No importable links found in that JSON'); return; }
      openHtmlImportPreview(candidates, 'Import from JSON');
    };
    reader.onerror = function(){ showToast('Could not read that file'); };
    reader.readAsText(file);
    e.target.value = '';
  });

  $('#htmlImportFileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    showToast('Reading file…');
    var reader = new FileReader();
    reader.onload = function(){
      setTimeout(function(){
        var candidates = [];
        try{ candidates = parseHtmlForImport(reader.result); }
        catch(err){ showToast('Could not read that HTML file'); return; }
        if(candidates.length===0){ showToast('No links found in that file'); return; }
        openHtmlImportPreview(candidates, 'Import from HTML');
      }, 30);
    };
    reader.onerror = function(){ showToast('Could not read that HTML file'); };
    reader.readAsText(file);
    e.target.value = '';
  });
  $('#tagCreatorToggle').addEventListener('change', renderImportRows);
  $('#tagCategoryToggle').addEventListener('change', renderImportRows);
  $('#htmlImportList').addEventListener('change', function(e){
    if(e.target.matches('input[type="checkbox"]')) updateImportCount();
  });
  $('#htmlImportSelectAll').addEventListener('click', function(){
    $all('#htmlImportList input[type="checkbox"]').forEach(function(cb){ cb.checked = true; });
    updateImportCount();
  });
  $('#htmlImportSelectNone').addEventListener('click', function(){
    $all('#htmlImportList input[type="checkbox"]').forEach(function(cb){ cb.checked = false; });
    updateImportCount();
  });
  $('#confirmHtmlImportBtn').addEventListener('click', commitHtmlImport);

  /* ---------------- init ---------------- */
  state.opens = (state.opens||0) + 1;
  if(!state.firstOpened) state.firstOpened = Date.now();
  persist();
  applyTheme();
  renderAll();
  if(window.Sync) window.Sync.init().then(refreshSyncUI);

})();
</script>
</body>
</html>
